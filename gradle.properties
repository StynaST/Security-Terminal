# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# Must match the Minecraft/NeoForge versions targeted by the AE2 build this addon compiles against.
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.21-beta

# Applied Energistics 2. 26.1 builds are not published to a public maven yet; publish a local build with
# `./gradlew publishMavenPublicationToMavenLocal` in the AE2 repository.
ae2_version=26.1.12-SNAPSHOT
ae2_version_range=[26.1.0,)

## Mod Properties
mod_id=securityterminal
mod_name=AE2 Security Terminal
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=net.styna.ae2securityterminal
